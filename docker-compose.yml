services:
  tablo:
    build: .
    container_name: tablo
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=file:/app/data/tablo.db
      - NEXTAUTH_SECRET=your-secret-key-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - EXTERNAL_API_URL=http://your-api-server:port
      - EXTERNAL_API_USERNAME=your-username
      - EXTERNAL_API_PASSWORD=your-password
    volumes:
      - tablo_data:/app/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  tablo_data:
    driver: local
